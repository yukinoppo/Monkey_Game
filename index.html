<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chimp Memory Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Chimp Memory Game</h1>

        <p class="instructions">
            Remember the numbers, then click the squares in order!
        </p>

        <div class="game-info">
            <p>Level: <span id="level">4</span></p>
            <p>Score: <span id="score">0</span></p>
        </div>

        <div class="username-section">
            <input
                    type="text"
                    id="usernameInput"
                    placeholder="Enter your name"
                    maxlength="15"
            >
        </div>

        <button id="startButton">Start Game</button>

        <div id="gameBoard"></div>

        <div id="gameOverPopup" class="hidden">
            <div class="popup-content">

                <h2>Game Over</h2>

                <p>Your Score: <span id="finalScore">0</span></p>

                <p id="resultMessage"></p>

                <h3>Leaderboard</h3>

                <div id="leaderboard">

                </div>

                <button id="playAgainButton">Play Again</button>

            </div>
        </div>

        <p id="message"></p>

        <button id="restartButton" class="hidden">
            Play Again
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
